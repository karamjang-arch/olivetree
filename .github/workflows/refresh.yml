name: 사이트 새로 그리기

# GitHub 예약은 UTC 기준이고 서머타임을 모르므로 두 시각을 모두 둔다.
# 새벽설교 반영: 동부 표준시(겨울) 12:10 UTC = 오전 7:10 / 서머타임(여름) 11:10 UTC = 오전 7:10
# 날짜 넘김: 05:05 UTC(겨울) / 04:05 UTC(여름) = 자정 5분 뒤
on:
  schedule:
    - cron: "10 11 * * *"
    - cron: "10 12 * * *"
    - cron: "5 4 * * *"
    - cron: "5 5 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 새로 그리기 요청
        run: curl -sS https://o-live-tree.vercel.app/api/revalidate
      - name: 주요 화면 미리 데우기 (첫 방문자가 기다리지 않게)
        env:
          PAGES: "/ /blog /sermon /honey /gospel /library /settle /search"
        run: |
          sleep 5
          for p in $PAGES; do curl -fsS -o /dev/null "https://o-live-tree.vercel.app$p"; done
          sleep 10
          for p in $PAGES; do curl -fsS -o /dev/null "https://o-live-tree.vercel.app$p"; done
